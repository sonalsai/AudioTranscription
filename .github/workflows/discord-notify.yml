name: Discord Notifications

on:
  pull_request:
    types: [opened, closed]
  push:
    branches:
      - main

jobs:
  discord_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          REPO_NAME=$(basename "${{ github.repository }}")

          # Initialize message
          MESSAGE=""

          # Handle Pull Request Events
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_URL="${{ github.event.pull_request.html_url }}"
            PR_AUTHOR="${{ github.event.pull_request.user.name || github.event.pull_request.user.login }}"
            PR_MERGED="${{ github.event.pull_request.merged }}"

            HEADER="✨=========================✨\n\n🤖  **$REPO_NAME**  \n\n✨=========================✨"

            if [ "$EVENT_ACTION" = "opened" ]; then
              MESSAGE="$HEADER\n\n🛠️ **New Pull Request Opened**\n\n👤 Author : **$PR_AUTHOR**\n\n📌 Title : [$PR_TITLE]($PR_URL)"
            elif [ "$EVENT_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
              MESSAGE="$HEADER\n\n✅ **Pull Request Merged Successfully**\n\n👤 Merged by : **$PR_AUTHOR**\n\n🔗 [$PR_TITLE]($PR_URL)"
            else
              MESSAGE="$HEADER\n\n❌ **Pull Request Closed Without Merge**\n\n👤 Closed by : **$PR_AUTHOR**\n\n📎 [$PR_TITLE]($PR_URL)"
            fi

          # Handle Push Events
          elif [ "$EVENT_NAME" = "push" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
            AUTHOR_NAME="${{ github.event.head_commit.author.name }}"
            COMMIT_URL="${{ github.event.head_commit.url }}"
            COMMIT_MSG="${{ github.event.head_commit.message }}"

            MESSAGE="✨=========================✨\n\n🤖  **$REPO_NAME**  \n\n✨=========================✨\n\n🚀 **New Commit Pushed**\n\n🌿 Branch : **$BRANCH_NAME**\n\n👤 Author : **$AUTHOR_NAME**\n\n📝 Commit : [$COMMIT_MSG]($COMMIT_URL)"

          else
            MESSAGE="⚠️ Unhandled event: $EVENT_NAME"
          fi

          echo "Sending message to Discord..."
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"$MESSAGE\"}" \
               $DISCORD_WEBHOOK_URL
