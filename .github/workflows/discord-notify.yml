name: Discord Notifications

on:
  pull_request:
    types: [opened, closed]
  push:
    branches:
      - main

jobs:
  discord_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_NAME: ${{ github.event.pull_request.user.name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          BRANCH_NAME: ${{ github.ref_name }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e  # fail if any command fails

          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          MESSAGE=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            AUTHOR_NAME=${PR_AUTHOR_NAME:-$PR_AUTHOR_LOGIN}

            if [ "$EVENT_ACTION" = "opened" ]; then
              MESSAGE="✨=========================✨\n📂 **Repository:** $REPO_NAME\n✨=========================✨\n\n🛠️ **New Pull Request Created**\n\n👤 Author: **$AUTHOR_NAME**\n\n📄 Title: **$PR_TITLE**\n\n🔗 [View Pull Request]($PR_URL)"
            
            elif [ "$EVENT_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
              MESSAGE="✨=========================✨\n📂 **Repository:** $REPO_NAME\n✨=========================✨\n\n✅ **Pull Request Merged Successfully!**\n\n👤 Merged by: **$AUTHOR_NAME**\n\n📄 Title: **$PR_TITLE**\n\n🔗 [View Pull Request]($PR_URL)"
            
            else
              MESSAGE="✨=========================✨\n📂 **Repository:** $REPO_NAME\n✨=========================✨\n\n❌ **Pull Request Closed Without Merge**\n\n👤 Closed by: **$AUTHOR_NAME**\n\n📄 Title: **$PR_TITLE**\n\n🔗 [View Pull Request]($PR_URL)"
            fi

          elif [ "$EVENT_NAME" = "push" ]; then
            MESSAGE="✨=========================✨\n📂 **Repository:** $REPO_NAME\n✨=========================✨\n\n🚀 **New Push to Branch:** $BRANCH_NAME\n\n👤 Author: **$AUTHOR**\n\n🧾 Commit: [$COMMIT_MSG]($COMMIT_URL)\n\n🔖 Commit ID: \`$SHORT_SHA\`"

          else
            MESSAGE="⚠️ Unhandled event type: $EVENT_NAME"
          fi

          echo "Sending message to Discord..."
          echo -e "$MESSAGE"
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"$MESSAGE\"}" \
               "$DISCORD_WEBHOOK_URL"
